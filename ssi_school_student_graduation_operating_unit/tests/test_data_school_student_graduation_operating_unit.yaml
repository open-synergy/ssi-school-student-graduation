scenarios:
  - name: "Student Graduation stores Operating Unit"
    steps:
      - step: "Setup - create operating unit partner"
        action: "create"
        model: "res.partner"
        save_as: "ou_partner"
        values:
          name: "Graduation Operating Unit Partner"

      - step: "Setup - create operating unit"
        action: "create"
        model: "operating.unit"
        save_as: "ou"
        values:
          name: "Graduation Operating Unit"
          code: "OUSG1"
          company_id: "REF: base.main_company"
          partner_id: "EVAL: registry['ou_partner'].id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Graduation OU Test"
          code: "GTSGOU1"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Graduation OU Test"
          code: "SCHSGOU1"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact Graduation OU Test"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Graduation OU Test"
          code: "STUSGOU1"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create student graduation with operating unit"
        action: "create"
        model: "school_student_graduation"
        save_as: "graduation"
        values:
          date: "2025-06-30"
          student_id: "EVAL: registry['student'].id"
          graduation_date: "2025-06-30"
          operating_unit_id: "EVAL: registry['ou'].id"

      - step: "Assert operating unit stored via search"
        action: "search"
        model: "school_student_graduation"
        domain:
          - ["id", "=", "EVAL: registry['graduation'].id"]
          - ["operating_unit_id", "=", "EVAL: registry['ou'].id"]
        save_as: "check_operating_unit_stored"
        expect_count: 1
