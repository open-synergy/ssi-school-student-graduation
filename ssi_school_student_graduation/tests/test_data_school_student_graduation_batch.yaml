options:
  auto_refresh: true

scenarios:
  - name: "Student Graduation Batch Full Workflow Confirm Approve Done"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Graduation Batch Test 1"
          code: "GTSGBY1"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Graduation Batch Test 1"
          code: "SCHSGBY1"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade for Graduation Batch Test 1"
          code: "GSGBY1"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class Graduation Batch Test 1"
          code: "CLSGBY1"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year Graduation Batch Test 1"
          code: "AYSGBY1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Term Graduation Batch Test 1"
          code: "TMSGBY1"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create student 1 contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_1"
        values:
          name: "Student Contact 1 Graduation Batch Test 1"

      - step: "Setup - create student 1"
        action: "create"
        model: "school_student"
        save_as: "student_1"
        values:
          name: "Student 1 Graduation Batch Test 1"
          code: "STUSGBY1A"
          contact_id: "EVAL: registry['contact_1'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Setup - create enrollment for student 1"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_1"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student_1'].id"
          currency_id: "EVAL: env.company.currency_id.id"

      - step: "Confirm enrollment 1"
        action: "call"
        target: "enrollment_1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve enrollment 1"
        action: "call"
        target: "enrollment_1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Setup - create student 2 contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_2"
        values:
          name: "Student Contact 2 Graduation Batch Test 1"

      - step: "Setup - create student 2"
        action: "create"
        model: "school_student"
        save_as: "student_2"
        values:
          name: "Student 2 Graduation Batch Test 1"
          code: "STUSGBY1B"
          contact_id: "EVAL: registry['contact_2'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Setup - create enrollment for student 2"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_2"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student_2'].id"
          currency_id: "EVAL: env.company.currency_id.id"

      - step: "Confirm enrollment 2"
        action: "call"
        target: "enrollment_2"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve enrollment 2"
        action: "call"
        target: "enrollment_2"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create graduation batch"
        action: "create"
        model: "school_student_graduation_batch"
        save_as: "batch"
        values:
          date: "2025-06-30"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          grade_id: "EVAL: registry['grade'].id"
          # Required because later steps read this document back as
          # base.user_admin:
          # school_student_graduation_batch_internal_user_rule only
          # exposes records the reading user owns, and the default
          # responsible would otherwise be the superuser that created it.
          user_id: "REF: base.user_admin"

      - step: "Populate eligible students"
        action: "call"
        target: "batch"
        method: "action_populate_lines"

      - step: "Assert two lines populated"
        action: "assert"
        target: "batch"
        asserts:
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Confirm batch"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve batch"
        action: "call"
        target: "batch"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert batch number generated on done"
        action: "assert"
        target: "batch"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "SGB"

      - step: "Assert student 1 moved to graduate"
        action: "search"
        model: "school_student"
        domain:
          - ["id", "=", "EVAL: registry['student_1'].id"]
          - ["state", "=", "graduate"]
        save_as: "check_student_1_graduate"
        expect_count: 1

      - step: "Assert student 2 moved to graduate"
        action: "search"
        model: "school_student"
        domain:
          - ["id", "=", "EVAL: registry['student_2'].id"]
          - ["state", "=", "graduate"]
        save_as: "check_student_2_graduate"
        expect_count: 1

      - step: "Assert enrollment 1 academic year result is graduate"
        action: "search"
        model: "school_enrollment"
        domain:
          - ["id", "=", "EVAL: registry['enrollment_1'].id"]
          - ["academic_year_result", "=", "graduate"]
        save_as: "check_enrollment_1_result"
        expect_count: 1

      - step: "Assert enrollment 2 academic year result is graduate"
        action: "search"
        model: "school_enrollment"
        domain:
          - ["id", "=", "EVAL: registry['enrollment_2'].id"]
          - ["academic_year_result", "=", "graduate"]
        save_as: "check_enrollment_2_result"
        expect_count: 1

      - step: "Assert generated graduation for student 1 is Done"
        action: "search"
        model: "school_student_graduation"
        domain:
          - ["student_id", "=", "EVAL: registry['student_1'].id"]
          - ["state", "=", "done"]
        save_as: "check_graduation_1_done"
        expect_count: 1

      - step: "Assert generated graduation for student 2 is Done"
        action: "search"
        model: "school_student_graduation"
        domain:
          - ["student_id", "=", "EVAL: registry['student_2'].id"]
          - ["state", "=", "done"]
        save_as: "check_graduation_2_done"
        expect_count: 1

  - name: "Complete Graduation Batch Without Line Is Rejected"
    steps:
      - step: "Create graduation batch without any line"
        action: "create"
        model: "school_student_graduation_batch"
        save_as: "batch"
        values:
          date: "2025-06-30"
          # Required because later steps read this document back as
          # base.user_admin:
          # school_student_graduation_batch_internal_user_rule only
          # exposes records the reading user owns, and the default
          # responsible would otherwise be the superuser that created it.
          user_id: "REF: base.user_admin"

      - step: "Assert batch has no line"
        action: "assert"
        target: "batch"
        asserts:
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

      - step: "Confirm batch"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approving the empty batch must be rejected"
        action: "call"
        target: "batch"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
          message_contains: "No student line has been added to this batch"

      - step: "Assert batch stays in confirm after the rejection"
        action: "assert"
        target: "batch"
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Complete Graduation Batch With Non Enrolled Students Is Rejected"
